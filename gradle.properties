org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# shared uses explicit jvmCommonMain dependsOn edges (AGP 9 android {} target).
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Apple targets can only be compiled on a macOS host; set to true there.
koma.enableIos=auto

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
